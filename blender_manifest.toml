schema_version = "1.0.0"

id = "palette_colorizer"
name = "Palette Colorizer"
version = "1.1.0"
tagline = "Assign curated color palettes to viewport objects and showcase materials"
maintainer = "Klra"
type = "add-on"

blender_version_min = "5.0.0"

license = [
    "SPDX:GPL-3.0-or-later",
]

copyright = [
    "2026 Klra",
]

tags = ["3D View", "Material"]

# Permissions: Declare each resource category that the add-on accesses.
# Each value is a short description without trailing punctuation.
[permissions]
clipboard = "Copy and paste palette share strings between users"
files = "Export and import palette JSON files and install add-on updates"

# Build: Exclude files that must not ship in the final zip archive.
[build]
paths_exclude_pattern = [
    "__pycache__/",
    ".git*",
    "*.zip",
    "*.pyc",
    ".DS_Store",
    "*.md",
    "assets/",
    "Astra Assets/",
    "generate_gumroad_assets.py",
    "click_*.py",
    "test_*.py",
    "upload_*.py",
    "_update/",
]
